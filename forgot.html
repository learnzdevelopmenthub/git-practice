<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
    }

    .forgot-container {
      background: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .forgot-container h1 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #333;
      font-size: 1.75rem;
    }

    .forgot-container .subtitle {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #666;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: #555;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #4a90e2;
    }

    .forgot-btn {
      width: 100%;
      padding: 0.75rem;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .forgot-btn:hover {
      background: #357abd;
    }

    .back-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #555;
    }

    .back-link a {
      color: #4a90e2;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="forgot-container">
    <h1>Forgot password</h1>
    <p class="subtitle">Enter your email address and we will send you a link to reset your password.</p>
    <form action="#" method="post">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
      </div>
      <button type="submit" class="forgot-btn">Send reset link</button>
    </form>
    <p class="back-link"><a href="login.html">Back to sign in</a></p>
  </div>
</body>
</html>
